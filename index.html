
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 0 - Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>FormProject</h2>

        <div>
            <a href="index.html">Task 0</a>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
            <a href="task4.html">Task 4</a>
        </div>
    </nav>

    <main class="container">
        <div class="form-card">
            <h1>Contact Us</h1>
            <p class="description">Send us a message using the form below.</p>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4"
                          placeholder="Write your message"></textarea>

                <button type="submit">Submit</button>
            </form>
        </div>
    </main>

</body>
</html>
