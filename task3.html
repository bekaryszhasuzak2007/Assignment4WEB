
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Validation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>FormProject</h2>

        <div>
            <a href="index.html">Task 0</a>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
            <a href="task4.html">Task 4</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="form-card mx-auto">
            <h1>Bootstrap Validation</h1>
            <p class="description">
                Enter your information and check the validation.
            </p>

            <form id="contactForm" novalidate>

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control"
                           id="name" name="name"
                           placeholder="Enter your name" required>
                    <div class="invalid-feedback">
                        Name is required.
                    </div>
                    <div class="valid-feedback">
                        Looks good!
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control"
                           id="email" name="email"
                           placeholder="name@example.com" required>
                    <div class="invalid-feedback">
                        Please enter a valid email.
                    </div>
                    <div class="valid-feedback">
                        Looks good!
                    </div>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control"
                              id="message" name="message"
                              rows="4" placeholder="Write your message"
                              required></textarea>
                    <div class="invalid-feedback">
                        Message is required.
                    </div>
                    <div class="valid-feedback">
                        Looks good!
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Submit
                </button>

            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("contactForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const inputs = form.querySelectorAll("input, textarea");

            inputs.forEach(function(input) {
                if (input.checkValidity()) {
                    input.classList.remove("is-invalid");
                    input.classList.add("is-valid");
                } else {
                    input.classList.remove("is-valid");
                    input.classList.add("is-invalid");
                }
            });
        });
    </script>

</body>
</html>
