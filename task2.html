
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>FormProject</h2>

        <div>
            <a href="index.html">Task 0</a>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
            <a href="task4.html">Task 4</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="form-card mx-auto">
            <h1>Bootstrap Contact Form</h1>
            <p class="description">
                Contact us using this Bootstrap form.
            </p>

            <form>
                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control"
                               id="name" name="name"
                               placeholder="Enter your name">
                        <div class="form-text">
                            Enter your full name.
                        </div>
                    </div>

                    <div class="col-12 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control"
                               id="email" name="email"
                               placeholder="name@example.com">
                        <div class="form-text">
                            We will use this email to contact you.
                        </div>
                    </div>

                    <div class="col-12 mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control"
                                  id="message" name="message"
                                  rows="4"
                                  placeholder="Write your message"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Submit
                </button>
            </form>
        </div>
    </main>

</body>
</html>
